plugins { id 'com.android.application' }
android {
    namespace 'io.gramaton.tv'
    compileSdk 36
    defaultConfig { applicationId 'io.gramaton.tv'; minSdk 26; targetSdk 35; versionCode 49; versionName '0.49'
        manifestPlaceholders = [launcherIcon: project.hasProperty('fireTv') ? '@drawable/banner' : '@mipmap/ic_launcher'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
}
